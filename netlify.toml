# Keep internal project docs out of the publicly served site.
# These files live in the repo for developer/handover reference, but
# Netlify's publish directory is the repo root, so without these rules
# they'd be reachable at huddlehire.co.uk/CLAUDE.md etc.

[[redirects]]
  from = "/CLAUDE.md"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/"
  status = 404
  force = true

# Baseline security headers. CSP is scoped to the site's only external
# dependency (Google Fonts) plus Netlify's own injected badge script
# (served same-origin from /.netlify/scripts/) — verify on the Deploy
# Preview that fonts render and the Netlify badge still works before
# merging, since CSP is the one header here that can visibly break something.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; script-src 'self' 'unsafe-inline' https://app.netlify.com; connect-src 'self' https://app.netlify.com; frame-src https://app.netlify.com; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
